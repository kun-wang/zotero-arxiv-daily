name: Test LLM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-llm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Test LLM connection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          uv run python - <<'PY'
          import os
          from omegaconf import OmegaConf
          from openai import OpenAI
          from zotero_arxiv_daily.protocol import Paper

          # Load the same configuration as the main workflow.
          config = OmegaConf.merge(
              OmegaConf.load("config/base.yaml"),
              OmegaConf.create(os.environ["CUSTOM_CONFIG"])
          )
          llm = OmegaConf.to_container(config.llm, resolve=True)

          api = llm["api"]
          model = llm["generation_kwargs"]["model"]

          if not api["key"] or api["key"] == "???":
              raise RuntimeError("LLM API key is missing")
          if not api["base_url"] or api["base_url"] == "???":
              raise RuntimeError("LLM API base URL is missing")
          if not model or model == "???":
              raise RuntimeError("LLM model is not configured")

          client = OpenAI(
              api_key=api["key"],
              base_url=api["base_url"],
              timeout=60.0,
              max_retries=0
          )

          # A synthetic paper: no arXiv retrieval required.
          paper = Paper(
              source="arxiv",
              title="Quantum Computing with Squeezed Light",
              authors=["Test Author"],
              abstract=(
                  "We investigate the use of squeezed optical "
                  "states for photonic quantum information "
                  "processing and quantum computation."
              ),
              url="https://example.com/test"
          )

          # Call the actual project TLDR method.
          # This method raises errors rather than silently
          # falling back to the original abstract.
          result = paper._generate_tldr_with_llm(client, llm)

          if not result or not result.strip():
              raise RuntimeError("LLM returned an empty response")

          print("LLM TEST SUCCESSFUL")
          print("Model:", model)
          print("API mode:", llm["api_mode"])
          print("Generated TLDR:", result)
          PY
